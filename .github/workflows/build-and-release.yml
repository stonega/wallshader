name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Check and build packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            desktop-file-utils \
            dpkg-dev \
            gjs \
            gettext \
            libgtk-4-bin \
            locales \
            meson \
            ninja-build \
            rpm \
            shellcheck \
            zstd
          sudo locale-gen en_US.UTF-8

      - name: Install shader and development dependencies
        run: bun install --frozen-lockfile

      - name: Check code and run logic tests
        run: |
          bun run check
          bun test
          bun run test:i18n
          shellcheck scripts/package.sh

      - name: Build packages
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            bun run package "$GITHUB_REF_NAME"
          else
            bun run package
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: wallshader-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.zst
            dist/SHA256SUMS
          compression-level: 0
          if-no-files-found: error

  flatpak:
    name: Flatpak (${{ matrix.variant.arch }})
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.variant.runner }}
    timeout-minutes: 30
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.stonega.wallshader.json
          bundle: wallshader-${{ matrix.variant.arch }}.flatpak
          arch: ${{ matrix.variant.arch }}
          build-dir: build-flatpak
          repo-dir: dist/flatpak/repo
          mirror-screenshots-url: https://dl.flathub.org/media
          artifact-name: wallshader-flatpak-${{ matrix.variant.arch }}

      - name: Upload companion animation extension
        if: matrix.variant.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: wallshader-extension
          path: build-flatpak/files/share/wallshader/wallshader-extension.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, flatpak]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v5
        with:
          name: wallshader-packages
          path: dist

      - name: Download Flatpak bundles
        uses: actions/download-artifact@v5
        with:
          pattern: wallshader-flatpak-*
          merge-multiple: true
          path: dist

      - name: Download companion animation extension
        uses: actions/download-artifact@v5
        with:
          name: wallshader-extension
          path: dist

      - name: Add Flatpak and extension checksums and verify packages
        working-directory: dist
        run: |
          sha256sum ./*.flatpak ./wallshader-extension.zip >> SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.deb dist/*.rpm dist/*.tar.zst dist/*.flatpak dist/wallshader-extension.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  ppa:
    name: Ubuntu PPA
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/publish-ppa.yml
    with:
      tag: ${{ github.ref_name }}
      publish: ${{ vars.PPA_ENABLED == 'true' }}
    secrets:
      PPA_GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
      PPA_GPG_PASSPHRASE: ${{ secrets.PPA_GPG_PASSPHRASE }}
