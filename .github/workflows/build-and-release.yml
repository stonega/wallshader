name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Check and build packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            desktop-file-utils \
            dpkg-dev \
            gjs \
            libgtk-4-bin \
            meson \
            ninja-build \
            rpm \
            shellcheck \
            zstd

      - name: Install shader and development dependencies
        run: bun install --frozen-lockfile

      - name: Check code and run logic tests
        run: |
          bun run check
          bun test
          shellcheck scripts/package.sh

      - name: Build packages
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            bun run package "$GITHUB_REF_NAME"
          else
            bun run package
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: wallshader-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.zst
            dist/SHA256SUMS
          compression-level: 0
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v5
        with:
          name: wallshader-packages
          path: dist

      - name: Verify package checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.deb dist/*.rpm dist/*.tar.zst dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
