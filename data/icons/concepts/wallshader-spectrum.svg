<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Wallshader — Spectrum Display</title>
  <desc>A softly rounded desktop display with luminous violet and amber planes converging at a magenta horizon.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#faf9ff"/>
      <stop offset=".45" stop-color="#dedbe8"/>
      <stop offset="1" stop-color="#b2aabd"/>
    </linearGradient>
    <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#9b94aa"/>
      <stop offset="1" stop-color="#655a79"/>
    </linearGradient>
    <linearGradient id="control-panel" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#b9b2ca"/>
      <stop offset=".4" stop-color="#e3deec"/>
      <stop offset="1" stop-color="#f4f0fa"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0f0b19"/>
      <stop offset=".52" stop-color="#030207"/>
      <stop offset="1" stop-color="#10091c"/>
    </linearGradient>
    <linearGradient id="top-amber" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffb52e" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#f06d55" stop-opacity=".7"/>
      <stop offset="1" stop-color="#6e36ff"/>
    </linearGradient>
    <linearGradient id="top-coral" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ff957f" stop-opacity=".6"/>
      <stop offset=".65" stop-color="#9e65ff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#5436ff"/>
    </linearGradient>
    <linearGradient id="top-lilac" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#acb8ff" stop-opacity=".7"/>
      <stop offset=".6" stop-color="#8157ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#4832f8"/>
    </linearGradient>
    <linearGradient id="top-violet" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#a666ff" stop-opacity=".6"/>
      <stop offset=".5" stop-color="#773cff"/>
      <stop offset="1" stop-color="#4030ee"/>
    </linearGradient>
    <linearGradient id="top-blue" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#6353ff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#3830f5"/>
    </linearGradient>
    <linearGradient id="magenta" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#d748f5" stop-opacity=".5"/>
      <stop offset=".42" stop-color="#ef77ff"/>
      <stop offset="1" stop-color="#9a20ce" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="bottom-violet" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffaf28"/>
      <stop offset=".65" stop-color="#7962ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#6439c9" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="bottom-blue" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffc345"/>
      <stop offset=".55" stop-color="#f9894d"/>
      <stop offset="1" stop-color="#918aff" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="bottom-coral" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffcb3d"/>
      <stop offset=".5" stop-color="#ff9c1a"/>
      <stop offset="1" stop-color="#ff7466" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="bottom-amber" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffe783"/>
      <stop offset=".35" stop-color="#ffd33e"/>
      <stop offset="1" stop-color="#ffa507" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="bottom-gold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffebad" stop-opacity=".2"/>
      <stop offset=".55" stop-color="#ffe88c"/>
      <stop offset="1" stop-color="#ffd54b" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#beb7cd"/>
    </linearGradient>
    <linearGradient id="reflection" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff" stop-opacity=".09"/>
      <stop offset=".65" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="13" y="27" width="88" height="70" rx="5"/>
    </clipPath>
  </defs>
  <!-- A compact front-facing display, with the depth on its lower edge. -->
  <rect x="8" y="25" width="112" height="83" rx="10" fill="#21182f" fill-opacity=".2"/>
  <rect x="8" y="24" width="112" height="82" rx="10" fill="url(#depth)"/>
  <rect x="8" y="20" width="112" height="82" rx="10" fill="url(#shell)"/>
  <path d="M108 20h2a10 10 0 0 1 10 10v62a10 10 0 0 1-10 10h-2Z" fill="url(#control-panel)"/>
  <path d="M18 20.75h92a9.25 9.25 0 0 1 9.25 9.25" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="1.5"/>
  <rect x="11.5" y="25.5" width="91" height="73" rx="6.5" fill="#5c526c"/>
  <rect x="13" y="27" width="88" height="70" rx="5" fill="url(#glass)"/>
  <!-- Translucent planes retain the reference's opposed fans and dark seam. -->
  <g clip-path="url(#screen)">
    <path d="M29 33H85L77 61H37Z" fill="url(#top-amber)"/>
    <path d="M26 37H88L77 61H37Z" fill="url(#top-coral)"/>
    <path d="M23 41H91L77 61H37Z" fill="url(#top-lilac)"/>
    <path d="M20 47H94L77 61H37Z" fill="url(#top-violet)"/>
    <path d="M17 54H97L77 62H37Z" fill="url(#top-blue)"/>
    <path d="M16 61H98L78 64H36Z" fill="url(#magenta)"/>
    <path d="M37 65H77L87 92H27Z" fill="url(#bottom-violet)"/>
    <path d="M37 65H77L91 88H23Z" fill="url(#bottom-blue)"/>
    <path d="M37 65H77L94 83H20Z" fill="url(#bottom-coral)"/>
    <path d="M37 65H77L97 76H17Z" fill="url(#bottom-amber)"/>
    <path d="M37 65H77L98 69.5H16Z" fill="url(#bottom-gold)"/>
    <path d="M13 27H101L13 58Z" fill="url(#reflection)"/>
  </g>
  <!-- The side controls echo the System Monitor icon without its waveform. -->
  <g fill="#82768f">
    <circle cx="111" cy="32" r="3"/>
    <circle cx="111" cy="43" r="3"/>
    <circle cx="111" cy="54" r="3"/>
  </g>
  <g fill="url(#button)">
    <circle cx="111" cy="31.25" r="2.5"/>
    <circle cx="111" cy="42.25" r="2.5"/>
    <circle cx="111" cy="53.25" r="2.5"/>
  </g>
  <rect x="108.5" y="86" width="5" height="3" rx="1.5" fill="#7e558f"/>
  <rect x="109" y="86" width="4" height="2" rx="1" fill="#df93ff"/>
</svg>
