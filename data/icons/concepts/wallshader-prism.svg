<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Wallshader — Prism</title>
  <desc>Rounded violet and golden shader layers opening around a bright horizon, in the GNOME app icon style.</desc>
  <defs>
    <linearGradient id="peach" x2="0" y2="1">
      <stop stop-color="#ffd09e"/>
      <stop offset="1" stop-color="#e697a3"/>
    </linearGradient>
    <linearGradient id="lilac" x2="0" y2="1">
      <stop stop-color="#d7c8ff"/>
      <stop offset="1" stop-color="#a68aea"/>
    </linearGradient>
    <linearGradient id="violet" x2="0" y2="1">
      <stop stop-color="#ba89fa"/>
      <stop offset="1" stop-color="#8751e9"/>
    </linearGradient>
    <linearGradient id="indigo" x2="0" y2="1">
      <stop stop-color="#8b74ff"/>
      <stop offset="1" stop-color="#5e46e4"/>
    </linearGradient>
    <linearGradient id="pink" x2="0" y2="1">
      <stop stop-color="#f6a5f4"/>
      <stop offset="1" stop-color="#cb63d9"/>
    </linearGradient>
    <linearGradient id="plum" x2="0" y2="1">
      <stop stop-color="#c7b5f3"/>
      <stop offset="1" stop-color="#9275cf"/>
    </linearGradient>
    <linearGradient id="coral" x2="0" y2="1">
      <stop stop-color="#ffb390"/>
      <stop offset="1" stop-color="#ee877d"/>
    </linearGradient>
    <linearGradient id="amber" x2="0" y2="1">
      <stop stop-color="#ffd681"/>
      <stop offset="1" stop-color="#ffb13e"/>
    </linearGradient>
    <linearGradient id="gold" x2="0" y2="1">
      <stop stop-color="#fff1b0"/>
      <stop offset="1" stop-color="#ffdc70"/>
    </linearGradient>
    <linearGradient id="light" x2="1" y2="0">
      <stop stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".65" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <path id="upper-peach" d="M32 14H96Q100 14 99 18L87 59Q86.4 61 84 61H44Q41.6 61 41 59L29 18Q28 14 32 14Z"/>
    <path id="upper-lilac" d="M26 26H102Q106 26 104.5 30L87 60Q86 62 83.5 62H44.5Q42 62 41 60L23.5 30Q22 26 26 26Z"/>
    <path id="upper-violet" d="M19 38H109Q114 38 110.5 42L88 62Q86.8 63 85 63H43Q41.2 63 40 62L17.5 42Q14 38 19 38Z"/>
    <path id="upper-indigo" d="M13 50H115Q120 50 116 53L88 64Q86.6 64.5 85 64.5H43Q41.4 64.5 40 64L12 53Q8 50 13 50Z"/>
    <path id="upper-pink" d="M11 62H117Q122 62 117 63.5L87 67Q86 67.2 84 67.2H44Q42 67.2 41 67L11 63.5Q6 62 11 62Z"/>
    <path id="lower-plum" d="M44 74H84Q86.5 74 87.4 76.5L101 108Q102.5 112 98 112H30Q25.5 112 27 108L40.6 76.5Q41.5 74 44 74Z"/>
    <path id="lower-coral" d="M43 74H85Q87 74 88.5 76L109 95Q112.5 99 107 99H21Q15.5 99 19 95L39.5 76Q41 74 43 74Z"/>
    <path id="lower-amber" d="M43 74H85Q87 74 88.5 75L115 82Q121 86 114 86H14Q7 86 13 82L39.5 75Q41 74 43 74Z"/>
    <path id="lower-gold" d="M44 72H84Q86 72 88 72.4L117 75.5Q122 77 117 77H11Q6 77 11 75.5L40 72.4Q42 72 44 72Z"/>
  </defs>

  <!-- Each sheet has a shallow lower edge, like a native GNOME object icon. -->
  <g id="cool-layers">
    <path d="M28.800 16.560 Q28.800 14.000 32.000 14.000 L96.000 14.000 Q99.200 14.000 99.200 16.560 L99.200 19.060 Q99.200 19.700 99.000 20.500 L87.000 61.500 Q86.400 63.500 84.000 63.500 L44.000 63.500 Q41.600 63.500 41.000 61.500 L29.000 20.500 Q28.800 19.700 28.800 19.060Z" fill="#bd7784"/>
    <use href="#upper-peach" fill="url(#peach)"/>
    <use href="#upper-peach" fill="url(#light)"/>
    <path d="M32 14.7H96" fill="none" stroke="#fff" stroke-opacity=".4" stroke-linecap="round"/>

    <path d="M23.091 28.116 Q23.091 26.000 26.000 26.000 L102.000 26.000 Q104.909 26.000 104.909 28.116 L104.909 30.616 Q104.909 31.409 104.500 32.500 L87.000 62.500 Q86.000 64.500 83.500 64.500 L44.500 64.500 Q42.000 64.500 41.000 62.500 L23.500 32.500 Q23.091 31.409 23.091 30.616Z" fill="#7d65b7"/>
    <use href="#upper-lilac" fill="url(#lilac)"/>
    <use href="#upper-lilac" fill="url(#light)"/>
    <path d="M26 26.7H102" fill="none" stroke="#fff" stroke-opacity=".4" stroke-linecap="round"/>

    <path d="M16.059 39.384 Q16.059 38.000 19.000 38.000 L109.000 38.000 Q111.941 38.000 111.941 39.384 L111.941 41.884 Q111.941 42.853 110.500 44.500 L88.000 64.500 Q86.800 65.500 85.000 65.500 L43.000 65.500 Q41.200 65.500 40.000 64.500 L17.500 44.500 Q16.059 42.853 16.059 41.884Z" fill="#6738ae"/>
    <use href="#upper-violet" fill="url(#violet)"/>
    <use href="#upper-violet" fill="url(#light)"/>
    <path d="M19 38.7H109" fill="none" stroke="#fff" stroke-opacity=".32" stroke-linecap="round"/>

    <path d="M10.222 50.926 Q10.222 50.000 13.000 50.000 L115.000 50.000 Q117.778 50.000 117.778 50.926 L117.778 53.426 Q117.778 54.167 116.000 55.500 L88.000 66.500 Q86.600 67.000 85.000 67.000 L43.000 67.000 Q41.400 67.000 40.000 66.500 L12.000 55.500 Q10.222 54.167 10.222 53.426Z" fill="#44309e"/>
    <use href="#upper-indigo" fill="url(#indigo)"/>
    <use href="#upper-indigo" fill="url(#light)"/>
    <path d="M14 50.7H114" fill="none" stroke="#fff" stroke-opacity=".27" stroke-linecap="round"/>

    <path d="M8.500 62.375 Q8.500 62.000 11.000 62.000 L117.000 62.000 Q119.500 62.000 119.500 62.375 L119.500 64.575 Q119.500 64.950 117.000 65.700 L87.000 69.200 Q86.000 69.400 84.000 69.400 L44.000 69.400 Q42.000 69.400 41.000 69.200 L11.000 65.700 Q8.500 64.950 8.500 64.575Z" fill="#9c45a9"/>
    <use href="#upper-pink" fill="url(#pink)"/>
    <path d="M13 62.6H115" fill="none" stroke="#fff" stroke-opacity=".42" stroke-linecap="round"/>
  </g>

  <!-- The opposing warm fan preserves the reference's open horizon. -->
  <g id="warm-layers">
    <path d="M26.625 109.750 Q26.625 109.000 27.000 108.000 L40.600 76.500 Q41.500 74.000 44.000 74.000 L84.000 74.000 Q86.500 74.000 87.400 76.500 L101.000 108.000 Q101.375 109.000 101.375 109.750 L101.375 112.750 Q101.375 115.000 98.000 115.000 L30.000 115.000 Q26.625 115.000 26.625 112.750Z" fill="#695095"/>
    <use href="#lower-plum" fill="url(#plum)"/>
    <use href="#lower-plum" fill="url(#light)"/>
    <path d="M30 111.3H98" fill="none" stroke="#fff" stroke-opacity=".14" stroke-linecap="round"/>

    <path d="M17.639 97.506 Q17.639 96.556 19.000 95.000 L39.500 76.000 Q41.000 74.000 43.000 74.000 L85.000 74.000 Q87.000 74.000 88.500 76.000 L109.000 95.000 Q110.361 96.556 110.361 97.506 L110.361 100.506 Q110.361 102.000 107.000 102.000 L21.000 102.000 Q17.639 102.000 17.639 100.506Z" fill="#ba5d5c"/>
    <use href="#lower-coral" fill="url(#coral)"/>
    <use href="#lower-coral" fill="url(#light)"/>
    <path d="M21 98.3H107" fill="none" stroke="#fff" stroke-opacity=".17" stroke-linecap="round"/>

    <path d="M10.231 84.840 Q10.231 83.846 13.000 82.000 L39.500 75.000 Q41.000 74.000 43.000 74.000 L85.000 74.000 Q87.000 74.000 88.500 75.000 L115.000 82.000 Q117.769 83.846 117.769 84.840 L117.769 87.840 Q117.769 89.000 114.000 89.000 L14.000 89.000 Q10.231 89.000 10.231 87.840Z" fill="#c7822a"/>
    <use href="#lower-amber" fill="url(#amber)"/>
    <use href="#lower-amber" fill="url(#light)"/>
    <path d="M15 85.3H113" fill="none" stroke="#fff" stroke-opacity=".24" stroke-linecap="round"/>

    <path d="M8.500 76.625 Q8.500 76.250 11.000 75.500 L40.000 72.400 Q42.000 72.000 44.000 72.000 L84.000 72.000 Q86.000 72.000 88.000 72.400 L117.000 75.500 Q119.500 76.250 119.500 76.625 L119.500 78.825 Q119.500 79.200 117.000 79.200 L11.000 79.200 Q8.500 79.200 8.500 78.825Z" fill="#c7a044"/>
    <use href="#lower-gold" fill="url(#gold)"/>
    <path d="M44 72.7H84" fill="none" stroke="#fff" stroke-opacity=".6" stroke-linecap="round"/>
  </g>
</svg>
